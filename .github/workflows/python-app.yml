name: Unified Full-Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx ruff mypy bandit safety
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Run Ruff Linting
      run: |
        cd backend
        ruff check .
        
    - name: Run Mypy Type Checking
      run: |
        cd backend
        PYTHONPATH=. mypy app/ --ignore-missing-imports
        
    - name: Security Scan (Bandit)
      run: |
        cd backend
        bandit -r app/ -c bandit.yaml
        
    - name: Security Scan (Safety)
      run: |
        cd backend
        safety check -r requirements.txt || true
        
    - name: Run Pytest Suite
      env:
        TESTING: "True"
        PYTHONPATH: "backend"
      run: |
        pytest tests/ backend/tests/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Run Frontend Unit Tests (Vitest)
      run: |
        cd frontend
        npm run test

    - name: Compile & Build Frontend (Next.js)
      env:
        NODE_OPTIONS: "--max-old-space-size=1536"
      run: |
        cd frontend
        npm run build

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run E2E Tests (Playwright)
      run: |
        cd frontend
        npx playwright test


